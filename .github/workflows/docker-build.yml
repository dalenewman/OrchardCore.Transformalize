name: CI - Build Docker image (feature branches)

on:
  push:
    # Run on every branch except the default branch `main`
    branches-ignore:
      - main
  pull_request:
    # Run for PRs that target the default branch (`main`) when the PR is created or reopened.
    # We intentionally omit `synchronize` to avoid duplicate builds when you push commits to a branch
    # that already triggers a `push` build. The push build will validate the branch; the PR events
    # still run for the initial PR lifecycle events.
    branches:
      - main
    types:
      - opened
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # This amd64-only build runs natively. Use Docker's bundled BuildKit
          # to avoid pulling a separate builder image from Docker Hub.
          driver: docker

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Site/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: orchardcore-transformalize:ci-${{ github.sha }}

      - name: Smoke test image
        run: docker run --rm --entrypoint dotnet orchardcore-transformalize:ci-${{ github.sha }} --info
